name: Publish Overdrive skills to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install npm CLI with trusted publishing support
        run: npm install --global npm@11.5.1
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$VERSION" || {
            echo "Release tag $RELEASE_TAG does not match package version $VERSION"
            exit 1
          }
      - name: Test installer
        run: npm test
      - name: Check npm package contents
        run: npm pack --dry-run
      - name: Test package checker
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate skill packages
        run: python3 scripts/check_skill_packages.py
      - name: Publish package with npm trusted publishing
        run: npm publish --access public
