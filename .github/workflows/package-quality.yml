name: Skill package quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test the package checker
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate skill packages
        run: python3 scripts/check_skill_packages.py
