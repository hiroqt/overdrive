name: Skill package and npm installer quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test npm installer
        run: npm test
      - name: Check npm package contents
        run: npm pack --dry-run
      - name: Test the package checker
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate skill packages
        run: python3 scripts/check_skill_packages.py
